<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多言語翻訳・読み上げアプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 720px;
      padding: 20px;
      align-self: flex-start;
    }
    @media (min-width: 600px) {
      .card { padding: 32px; align-self: center; }
    }

    h1 { font-size: 20px; color: #1a202c; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #718096; margin-bottom: 18px; }

    /* ── 言語選択バー ── */
    .lang-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f7fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .lang-select {
      flex: 1;
      min-width: 120px;
      font-size: 15px;
      padding: 8px 10px;
      border: 1.5px solid #c3dafe;
      border-radius: 8px;
      font-family: inherit;
      color: #2d3748;
      background: white;
      font-weight: 600;
      cursor: pointer;
    }
    .lang-arrow {
      font-size: 20px;
      color: #a0aec0;
      flex-shrink: 0;
    }
    .swap-btn {
      background: #edf2ff;
      color: #667eea;
      border: 2px solid #c3dafe;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(0,0,0,0.1);
      -webkit-user-select: none;
      user-select: none;
    }
    .swap-btn:active { background: #c3dafe; }

    /* ── テキスト ── */
    .section { margin-bottom: 16px; }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #718096;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    textarea {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #667eea; }

    .result-box {
      background: #f7fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.6;
      min-height: 72px;
      color: #2d3748;
    }
    .result-box.empty { color: #a0aec0; font-style: italic; }

    /* ── スライダー行 ── */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .slider-row .field-label { margin: 0; min-width: 96px; white-space: nowrap; }
    .slider-row input[type="range"] { flex: 1; height: 22px; accent-color: #667eea; }
    .slider-row select {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      padding: 7px 10px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-family: inherit;
      color: #2d3748;
      background: white;
    }
    .val-disp { font-size: 13px; color: #718096; min-width: 36px; text-align: right; }

    /* ── ボタン ── */
    hr.divider { border: none; border-top: 1.5px solid #e2e8f0; margin: 18px 0 12px; }
    .btn-label {
      font-size: 11px; font-weight: 700; color: #a0aec0;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
    }
    .controls {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }
    @media (min-width: 520px) {
      .controls { grid-template-columns: 2fr 1fr 1fr 1fr 1fr; }
    }
    .btn {
      padding: 14px 8px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(0,0,0,0.1);
    }
    .btn:active { filter: brightness(0.9); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-translate { background: #667eea; color: white; grid-column: 1 / -1; }
    @media (min-width: 520px) { .btn-translate { grid-column: auto; } }
    .btn-play  { background: #48bb78; color: white; }
    .btn-pause { background: #ed8936; color: white; }
    .btn-stop  { background: #fc8181; color: white; }
    .btn-save  { background: #805ad5; color: white; }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #718096;
      min-height: 18px;
      word-break: break-all;
    }
    .status.err  { color: #e53e3e; }
    .status.ok   { color: #38a169; }
    .status.warn { color: #ed8936; }
    .status.load { color: #667eea; }
  </style>
</head>
<body>
<div class="card">
  <h1>🌐 多言語翻訳・読み上げアプリ</h1>
  <p class="subtitle">テキストを翻訳して音声で読み上げます</p>

  <!-- 言語選択バー -->
  <div class="lang-bar">
    <select class="lang-select" id="srcLang"></select>
    <span class="lang-arrow">→</span>
    <select class="lang-select" id="tgtLang"></select>
    <button class="swap-btn" id="swapBtn">⇄</button>
  </div>

  <div class="section">
    <label class="field-label" id="inputLabel">入力テキスト</label>
    <textarea id="inputText" placeholder="テキストを入力..."></textarea>
  </div>

  <div class="section">
    <label class="field-label" id="outputLabel">翻訳結果</label>
    <div id="translatedText" class="result-box empty">翻訳結果がここに表示されます</div>
  </div>

  <div class="slider-row">
    <label class="field-label">声の種類</label>
    <select id="voiceSelect"><option>読み込み中...</option></select>
  </div>
  <div class="slider-row">
    <label class="field-label">音量</label>
    <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
    <span class="val-disp" id="volumeVal">1.0</span>
  </div>
  <div class="slider-row">
    <label class="field-label">読み上げ速度</label>
    <input type="range" id="speed" min="0.5" max="2" step="0.05" value="0.9">
    <span class="val-disp" id="speedVal">0.9</span>
  </div>
  <div class="slider-row">
    <label class="field-label">ピッチ</label>
    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1.1">
    <span class="val-disp" id="pitchVal">1.1</span>
  </div>

  <hr class="divider">
  <div class="btn-label">操作ボタン</div>
  <div class="controls">
    <button class="btn btn-translate" id="translateBtn">翻訳する</button>
    <button class="btn btn-play"  id="speakBtn"  disabled>▶ 再生</button>
    <button class="btn btn-pause" id="pauseBtn"  disabled>⏸ 一時停止</button>
    <button class="btn btn-stop"  id="stopBtn"   disabled>■ 停止</button>
    <button class="btn btn-save"  id="saveBtn"   disabled>💾 保存</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
// ── 対応言語リスト ────────────────────────
const LANGUAGES = [
  { code: 'ja', name: '🇯🇵 日本語',     voice: 'ja-JP' },
  { code: 'en', name: '🇺🇸 英語',       voice: 'en-US' },
  { code: 'zh', name: '🇨🇳 中国語（簡体）', voice: 'zh-CN' },
  { code: 'zh-TW', name: '🇹🇼 中国語（繁体）', voice: 'zh-TW' },
  { code: 'ko', name: '🇰🇷 韓国語',     voice: 'ko-KR' },
  { code: 'fr', name: '🇫🇷 フランス語', voice: 'fr-FR' },
  { code: 'de', name: '🇩🇪 ドイツ語',   voice: 'de-DE' },
  { code: 'es', name: '🇪🇸 スペイン語', voice: 'es-ES' },
  { code: 'it', name: '🇮🇹 イタリア語', voice: 'it-IT' },
  { code: 'pt', name: '🇧🇷 ポルトガル語', voice: 'pt-BR' },
  { code: 'ru', name: '🇷🇺 ロシア語',   voice: 'ru-RU' },
  { code: 'ar', name: '🇸🇦 アラビア語', voice: 'ar-SA' },
  { code: 'hi', name: '🇮🇳 ヒンディー語', voice: 'hi-IN' },
  { code: 'th', name: '🇹🇭 タイ語',     voice: 'th-TH' },
  { code: 'vi', name: '🇻🇳 ベトナム語', voice: 'vi-VN' },
  { code: 'id', name: '🇮🇩 インドネシア語', voice: 'id-ID' },
  { code: 'nl', name: '🇳🇱 オランダ語', voice: 'nl-NL' },
  { code: 'sv', name: '🇸🇪 スウェーデン語', voice: 'sv-SE' },
  { code: 'no', name: '🇳🇴 ノルウェー語', voice: 'nb-NO' },
  { code: 'da', name: '🇩🇰 デンマーク語', voice: 'da-DK' },
  { code: 'fi', name: '🇫🇮 フィンランド語', voice: 'fi-FI' },
  { code: 'pl', name: '🇵🇱 ポーランド語', voice: 'pl-PL' },
  { code: 'tr', name: '🇹🇷 トルコ語',   voice: 'tr-TR' },
  { code: 'uk', name: '🇺🇦 ウクライナ語', voice: 'uk-UA' },
  { code: 'el', name: '🇬🇷 ギリシャ語', voice: 'el-GR' },
];

// ── DOM ─────────────────────────────────
const $ = id => document.getElementById(id);
const srcLangSel   = $('srcLang');
const tgtLangSel   = $('tgtLang');
const swapBtn      = $('swapBtn');
const inputText    = $('inputText');
const translatedEl = $('translatedText');
const inputLabel   = $('inputLabel');
const outputLabel  = $('outputLabel');
const voiceSelect  = $('voiceSelect');
const volumeSlider = $('volume');
const speedSlider  = $('speed');
const pitchSlider  = $('pitch');
const volumeVal    = $('volumeVal');
const speedVal     = $('speedVal');
const pitchVal     = $('pitchVal');
const translateBtn = $('translateBtn');
const speakBtn     = $('speakBtn');
const pauseBtn     = $('pauseBtn');
const stopBtn      = $('stopBtn');
const saveBtn      = $('saveBtn');
const statusEl     = $('status');

// ── 状態 ────────────────────────────────
let translated = '';
let playState  = 'idle';

// ── 言語セレクト初期化 ───────────────────
function buildLangOptions() {
  LANGUAGES.forEach(function(lang, i) {
    var o1 = document.createElement('option');
    o1.value = i; o1.textContent = lang.name;
    srcLangSel.appendChild(o1);
    var o2 = document.createElement('option');
    o2.value = i; o2.textContent = lang.name;
    tgtLangSel.appendChild(o2);
  });
  srcLangSel.value = 1; // 英語
  tgtLangSel.value = 0; // 日本語
  updateLabels();
}
buildLangOptions();

function getSrc() { return LANGUAGES[parseInt(srcLangSel.value, 10)]; }
function getTgt() { return LANGUAGES[parseInt(tgtLangSel.value, 10)]; }

function updateLabels() {
  inputLabel.textContent  = '入力テキスト（' + getSrc().name + '）';
  outputLabel.textContent = '翻訳結果（' + getTgt().name + '）';
  populateVoices();
}

srcLangSel.addEventListener('change', function() { reset(); updateLabels(); });
tgtLangSel.addEventListener('change', function() { reset(); updateLabels(); });

function doSwap() {
  var tmp = srcLangSel.value;
  srcLangSel.value = tgtLangSel.value;
  tgtLangSel.value = tmp;
  reset();
  updateLabels();
}
swapBtn.addEventListener('click', doSwap);
swapBtn.addEventListener('touchend', function(e) {
  e.preventDefault();
  doSwap();
});

function reset() {
  inputText.value = '';
  translatedEl.textContent = '翻訳結果がここに表示されます';
  translatedEl.classList.add('empty');
  translated = '';
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e) {}
  playState = 'idle';
  refreshButtons();
  setStatus('');
}

// ── 声一覧 ───────────────────────────────
function populateVoices() {
  try {
    if (!window.speechSynthesis) return;
    var tgt    = getTgt();
    var prefix = tgt.voice.split('-')[0];
    var voices = speechSynthesis.getVoices();
    var list   = voices.filter(function(v) {
      return v.lang === tgt.voice || v.lang.startsWith(prefix);
    });
    voiceSelect.innerHTML = '';
    if (!list.length) {
      voiceSelect.innerHTML = '<option value="">（声が見つかりません）</option>';
      return;
    }
    list.forEach(function(v, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = v.name + (v.localService ? '' : ' 🌐');
      voiceSelect.appendChild(opt);
    });
    // 高品質音声を優先
    var best = list.findIndex(function(v) {
      return !v.name.toLowerCase().includes('compact');
    });
    if (best >= 0) voiceSelect.value = best;
  } catch(e) {}
}

function getVoice() {
  try {
    var tgt    = getTgt();
    var prefix = tgt.voice.split('-')[0];
    var voices = speechSynthesis.getVoices();
    var list   = voices.filter(function(v) {
      return v.lang === tgt.voice || v.lang.startsWith(prefix);
    });
    return list[parseInt(voiceSelect.value, 10)] || null;
  } catch(e) { return null; }
}

if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = populateVoices;
  setTimeout(populateVoices, 300);
}

// ── スライダー ───────────────────────────
volumeSlider.addEventListener('input', function() { volumeVal.textContent = parseFloat(volumeSlider.value).toFixed(1); });
speedSlider.addEventListener('input',  function() { speedVal.textContent  = parseFloat(speedSlider.value).toFixed(2).replace(/0$/, ''); });
pitchSlider.addEventListener('input',  function() { pitchVal.textContent  = parseFloat(pitchSlider.value).toFixed(1); });

// ── ボタン状態 ───────────────────────────
function refreshButtons() {
  speakBtn.disabled = (playState !== 'idle') || !translated;
  stopBtn.disabled  = (playState === 'idle');
  saveBtn.disabled  = !translated;
  if (playState === 'paused') {
    pauseBtn.textContent = '▶ 再開';
    pauseBtn.disabled    = false;
  } else {
    pauseBtn.textContent = '⏸ 一時停止';
    pauseBtn.disabled    = (playState !== 'speaking');
  }
}

// ── タイムスタンプ除去 ───────────────────
function stripTimestamps(text) {
  return text
    .replace(/\[?\(?\d{1,2}:\d{2}(:\d{2})?\]?\)?/g, '')
    .replace(/^\s*[\r\n]/gm, '')
    .replace(/\n{2,}/g, '\n')
    .trim();
}

// ── 翻訳 ────────────────────────────────
async function callTranslate(text) {
  var src = getSrc().code;
  var tgt = getTgt().code;
  var url = 'https://translate.googleapis.com/translate_a/single'
    + '?client=gtx&sl=' + src + '&tl=' + tgt
    + '&dt=t&q=' + encodeURIComponent(text);
  var res  = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  var data = await res.json();
  var out  = '';
  for (var i = 0; i < data[0].length; i++) {
    if (data[0][i] && data[0][i][0]) out += data[0][i][0];
  }
  return out;
}

translateBtn.addEventListener('click', async function() {
  var raw = inputText.value.trim();
  if (!raw) { setStatus('テキストを入力してください', 'err'); return; }
  if (getSrc().code === getTgt().code) { setStatus('翻訳元と翻訳先に同じ言語は選べません', 'err'); return; }
  var text = stripTimestamps(raw);
  translateBtn.disabled = true;
  translated = '';
  refreshButtons();
  setStatus('翻訳中...', 'load');
  try {
    var result = await callTranslate(text);
    if (!result) throw new Error('翻訳結果が空でした');
    translated = result;
    translatedEl.textContent = result;
    translatedEl.classList.remove('empty');
    setStatus('翻訳完了 ✓', 'ok');
  } catch(e) {
    setStatus('翻訳エラー: ' + e.message + ' ※インターネット接続を確認してください', 'err');
  } finally {
    translateBtn.disabled = false;
    refreshButtons();
  }
});

// ── 再生 ────────────────────────────────
speakBtn.addEventListener('click', function() {
  if (!translated || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); } catch(e) {}
  var utt  = new SpeechSynthesisUtterance(translated);
  utt.lang   = getTgt().voice;
  utt.rate   = parseFloat(speedSlider.value);
  utt.pitch  = parseFloat(pitchSlider.value);
  utt.volume = parseFloat(volumeSlider.value);
  var voice  = getVoice();
  if (voice) utt.voice = voice;
  utt.onstart = function() { playState = 'speaking'; refreshButtons(); setStatus('読み上げ中...', 'ok'); };
  utt.onend   = function() { playState = 'idle';     refreshButtons(); setStatus('読み上げ完了 ✓'); };
  utt.onerror = function(e) { playState = 'idle';    refreshButtons(); setStatus('読み上げエラー: ' + e.error, 'err'); };
  speechSynthesis.speak(utt);
});

pauseBtn.addEventListener('click', function() {
  if (playState === 'speaking') {
    speechSynthesis.pause();
    playState = 'paused';
    setStatus('一時停止中', 'warn');
  } else if (playState === 'paused') {
    speechSynthesis.resume();
    playState = 'speaking';
    setStatus('読み上げ中...', 'ok');
  }
  refreshButtons();
});

stopBtn.addEventListener('click', function() {
  try { speechSynthesis.cancel(); } catch(e) {}
  playState = 'idle';
  refreshButtons();
  setStatus('');
});

// ── 保存 ────────────────────────────────
saveBtn.addEventListener('click', async function() {
  if (!translated) return;
  var bom  = '﻿';
  var blob = new Blob([bom + translated], { type: 'text/plain;charset=utf-8' });
  if (window.showSaveFilePicker) {
    try {
      var handle = await window.showSaveFilePicker({
        suggestedName: '翻訳結果.txt',
        startIn: 'desktop',
        types: [{ description: 'テキストファイル', accept: { 'text/plain': ['.txt'] } }],
      });
      var w = await handle.createWritable();
      await w.write(blob); await w.close();
      setStatus('保存しました: ' + handle.name, 'ok');
    } catch(e) {
      if (e.name !== 'AbortError') setStatus('保存エラー: ' + e.message, 'err');
    }
    return;
  }
  var name = (prompt('ファイル名を入力してください', '翻訳結果') || '翻訳結果').replace(/\.txt$/, '') + '.txt';
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  setStatus('保存しました: ' + name, 'ok');
});

// ── Enter で翻訳 ─────────────────────────
inputText.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); translateBtn.click(); }
});

function setStatus(msg, cls) {
  statusEl.textContent = msg || '';
  statusEl.className   = 'status' + (cls ? ' ' + cls : '');
}

refreshButtons();
</script>
</body>
</html>
